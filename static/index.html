<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>DocLabeler · Document Field Annotation</title>
  <link rel="stylesheet" href="/static/vendor/bootstrap/bootstrap.min.css" />
  <link rel="stylesheet" href="/static/vendor/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <i class="bi bi-tags-fill" aria-hidden="true"></i>
      <span>DocLabeler</span>
    </a>
    <div class="topbar-center" id="topbar-center"></div>
    <div class="topbar-actions" id="topbar-actions"></div>
  </header>
  <div id="conflict-banner" class="conflict-banner" role="alert" hidden>
    <i class="bi bi-exclamation-triangle" aria-hidden="true"></i>
    <span class="conflict-text">This case was changed in another window</span>
    <span class="flex-grow-1"></span>
    <button type="button" class="btn small" id="btn-conflict-reload">Reload</button>
    <button type="button" class="btn small primary" id="btn-conflict-keep">Keep mine</button>
  </div>
  <main id="view" class="view"></main>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
